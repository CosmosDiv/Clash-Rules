name: Apply proxy structure optimization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-proxy-structure.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply deterministic YAML structure changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('Sub-Store/config/openclash_pro.yaml'),
              Path('Sub-Store/config/mihomo_pro.yaml'),
              Path('Sub-Store/config/surfing_pro.yaml'),
          ]
          regions_all = ['HK','TW','SG','JP','KR','US','CA','AU','UK','EU']

          def tiered(regions):
              return [f'{r} Trust Auto' for r in regions] + [f'{r} Normal Auto' for r in regions]

          def fmt(items):
              return '[' + ', '.join(items) + ']'

          repls = {
              'proxies: [HK Auto, TW Auto, SG Auto, JP Auto, KR Auto, US Auto, CA Auto, AU Auto, UK Auto, EU Auto]':
                  'proxies: ' + fmt(tiered(['HK','TW','SG','JP','KR','US','CA','AU','UK','EU'])),
              'proxies: [US Auto, HK Auto, JP Auto, TW Auto, SG Auto]':
                  'proxies: ' + fmt(tiered(['US','HK','JP','TW','SG'])),
              'proxies: [SG Auto, TW Auto, HK Auto, JP Auto, US Auto]':
                  'proxies: ' + fmt(tiered(['SG','TW','HK','JP','US'])),
              'proxies: [HK Auto, SG Auto, JP Auto, TW Auto, US Auto]':
                  'proxies: ' + fmt(tiered(['HK','SG','JP','TW','US'])),
              'proxies: [US Auto, SG Auto, TW Auto, HK Auto, JP Auto]':
                  'proxies: ' + fmt(tiered(['US','SG','TW','HK','JP'])),
              'proxies: [US Auto, JP Auto, TW Auto, SG Auto, HK Auto]':
                  'proxies: ' + fmt(tiered(['US','JP','TW','SG','HK'])),
              'proxies: [SG Auto, TW Auto, JP Auto, HK Auto, US Auto]':
                  'proxies: ' + fmt(tiered(['SG','TW','JP','HK','US'])),
              'proxies: [HK Auto, TW Auto, JP Auto, SG Auto, US Auto]':
                  'proxies: ' + fmt(tiered(['HK','TW','JP','SG','US'])),
              'proxies: [US AI, JP AI, TW AI, SG AI]':
                  'proxies: ' + fmt(
                      [f'{r} Trust ConsIP' for r in ['US','JP','TW','SG']] +
                      [f'{r} Trust BusiIP' for r in ['US','JP','TW','SG']] +
                      [f'{r} Trust HostIP' for r in ['US','JP','TW','SG']]
                  ),
          }

          icons = {
              'HK':'Hong_Kong','TW':'TW','SG':'SG','JP':'JP','KR':'KR',
              'US':'United_States','CA':'Canada','AU':'Australia',
              'UK':'United_Kingdom','EU':'EU'
          }

          for p in paths:
              s = p.read_text(encoding='utf-8')
              start = s.index('# ==================== 05. Proxy Groups ====================')
              end = s.index('# ==================== 06. Rule Provider Templates ====================')
              block = s[start:end]

              for old, new in repls.items():
                  if old not in block:
                      raise SystemExit(f'{p}: missing expected list: {old}')
                  block = block.replace(old, new)

              old = '''  - name: Front Proxy\n    type: select\n    proxies: [Front Auto, Front Manual, Direct]\n    default-selected: Front Auto\n    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"\n'''
              new = '''  - name: Front Proxy\n    <<: *select-nodes\n    proxies: [Front Auto, Direct]\n    filter: *filter-all-ordinary\n    exclude-filter: *exclude-chain\n    default-selected: Front Auto\n    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"\n'''
              if old not in block: raise SystemExit(f'{p}: Front Proxy block missing')
              block = block.replace(old, new)

              old = '''  - name: Front Manual\n    <<: *select-nodes\n    filter: *filter-all-ordinary\n    exclude-filter: *exclude-chain\n    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"\n'''
              if old not in block: raise SystemExit(f'{p}: Front Manual block missing')
              block = block.replace(old, '')

              old = '''  - name: YouTube\n    type: select\n    proxies: [YouTube Auto, YouTube Bulk, YouTube Manual, Proxy]\n    default-selected: YouTube Auto\n    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png"\n'''
              new = '''  - name: YouTube\n    <<: *select-nodes\n    proxies: [YouTube Auto, YouTube Bulk, Proxy]\n    filter: *filter-youtube-bulk\n    exclude-filter: *exclude-chain\n    default-selected: YouTube Auto\n    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png"\n'''
              if old not in block: raise SystemExit(f'{p}: YouTube selector missing')
              block = block.replace(old, new)

              old = '''  - name: YouTube Manual\n    <<: *select-nodes\n    filter: *filter-youtube-bulk\n    exclude-filter: *exclude-chain\n    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/YouTube.png"\n'''
              if old not in block: raise SystemExit(f'{p}: YouTube Manual block missing')
              block = block.replace(old, '')

              for r in regions_all:
                  old = f'''  - name: {r}\n    type: select\n    proxies: [{r} Auto, {r} Manual]\n    default-selected: {r} Auto\n    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/{icons[r]}.png"\n'''
                  new = f'''  - name: {r}\n    <<: *select-nodes\n    proxies: [{r} Auto]\n    filter: *filter-{r.lower()}-manual\n    exclude-filter: *exclude-chain\n    default-selected: {r} Auto\n    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/{icons[r]}.png"\n'''
                  if old not in block: raise SystemExit(f'{p}: {r} selector missing')
                  block = block.replace(old, new)

              pat = r'\n  # ---------- Region Manual ----------\n.*?(?=\n  # ---------- AI Identity Pools ----------)'
              m = re.search(pat, block, flags=re.S)
              if not m: raise SystemExit(f'{p}: Region Manual section not found')
              block = block[:m.start()] + '\n' + block[m.end():]

              block = block.replace(
                  '  # ---------- Region Selectors ----------',
                  '  # ---------- Region Selectors: Auto + Direct Nodes ----------'
              )
              block = block.replace(
                  '  # ---------- Service Auto (hidden) ----------',
                  '  # ---------- Service Auto (hidden; Quality Tier -> Region) ----------'
              )

              out = s[:start] + block + s[end:]
              p.write_text(out, encoding='utf-8')

          for p in paths:
              t = p.read_text(encoding='utf-8')
              for bad in ['Front Manual', 'YouTube Manual'] + [f'{r} Manual' for r in regions_all]:
                  if f'- name: {bad}' in t:
                      raise SystemExit(f'{p}: stale manual group remains: {bad}')
              if 'test-interval: &test-interval 600' not in t:
                  raise SystemExit(f'{p}: test interval unexpectedly changed')
              if 'health-check:\n      enable: false' not in t:
                  raise SystemExit(f'{p}: provider health-check unexpectedly changed')

          surf = paths[2].read_text(encoding='utf-8')
          if '- name: DNS Hijack\n    type: dns' not in surf:
              raise SystemExit('Surfing DNS Hijack proxy was lost')
          if '- DST-PORT,53,DNS Hijack' not in surf:
              raise SystemExit('Surfing DNS Hijack rule was lost')
          PY

      - name: Commit three optimized configs and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-proxy-structure.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sub-Store/config/openclash_pro.yaml \
                  Sub-Store/config/mihomo_pro.yaml \
                  Sub-Store/config/surfing_pro.yaml \
                  .github/workflows/apply-proxy-structure.yml
          git diff --cached --check
          git commit -m "Optimize proxy group fallback structure"
          git push origin HEAD:main
