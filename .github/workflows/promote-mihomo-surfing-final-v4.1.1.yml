name: Promote Mihomo Surfing Final V4.1.1

on:
  push:
    branches:
      - mihomo-surfing-final-v4.1.1
    paths:
      - .github/workflows/promote-mihomo-surfing-final-v4.1.1.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mihomo-surfing-final-v4.1.1
          fetch-depth: 0

      - name: Apply Final catch-all and validate both configs
        shell: bash
        run: |
          python -m pip install --quiet pyyaml
          python <<'PY'
          from pathlib import Path
          import yaml

          files = [
              ('Sub-Store/config/mihomo_pro.yaml', 'Mihomo Bare-Core Quality / Identity Routing'),
              ('Sub-Store/config/surfing_pro.yaml', 'Surfing / Android Magisk Quality / Identity Routing'),
          ]

          direct_block = '''  - name: Direct\n    type: select\n    proxies: [DIRECT]\n    default-selected: DIRECT\n    hidden: true\n    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png"\n'''
          final_block = direct_block + '''  - name: Final\n    type: select\n    proxies: [Proxy, Direct]\n    default-selected: Proxy\n'''
          old_tail = '  - MATCH,Proxy\n\n# ==================== EOF ====================\n'
          new_tail = '''  # ---------- Final catch-all ----------\n  # Unknown traffic stays proxy-first; switch Final to Direct only when testing/handling domestic edge cases.\n  - MATCH,Final\n\n# ==================== EOF ====================\n'''

          for path, title in files:
              p = Path(path)
              s = p.read_text(encoding='utf-8')

              # Guard the exact V4.1.0 baseline and ensure this migration is not partially applied.
              old_version = f'# {title} V4.1.0'
              new_version = f'# {title} V4.1.1'
              assert old_version in s, (path, 'unexpected version')
              assert '  - name: Final\n' not in s, (path, 'Final already exists')
              assert s.count('  - MATCH,Proxy') == 1, (path, 'unexpected MATCH,Proxy count')
              assert s.count(direct_block) == 1, (path, 'unexpected Direct group shape')

              s = s.replace(old_version, new_version, 1)

              old_header = "#   Fallback keeps `lazy: true` and selects the first alive node in the resulting order.\n"
              assert old_header in s, (path, 'policy header changed')
              s = s.replace(
                  old_header,
                  old_header + "#   Final catch-all remains proxy-first while exposing a manual Direct override.\n",
                  1,
              )

              s = s.replace(direct_block, final_block, 1)
              assert old_tail in s, (path, 'rules tail changed')
              s = s.replace(old_tail, new_tail, 1)
              p.write_text(s, encoding='utf-8')

              data = yaml.safe_load(s)
              assert isinstance(data, dict), path

              # Shared V4.1 architecture invariants.
              assert len(data['x-filter-order-main'].split('`')) == 20, (path, 'main bucket count')
              groups = data['proxy-groups']
              names = [g.get('name') for g in groups]
              assert len(names) == len(set(names)), (path, 'duplicate proxy-group names')
              final_groups = [g for g in groups if g.get('name') == 'Final']
              assert len(final_groups) == 1, (path, 'Final count')
              final = final_groups[0]
              assert final.get('type') == 'select', (path, 'Final type')
              assert final.get('proxies') == ['Proxy', 'Direct'], (path, 'Final members/order')
              assert final.get('default-selected') == 'Proxy', (path, 'Final default')
              assert data['rules'][-1] == 'MATCH,Final', (path, 'last rule')
              assert 'MATCH,Proxy' not in data['rules'], (path, 'old catch-all remains')

              fallback_groups = [g for g in groups if g.get('type') == 'fallback']
              assert len(fallback_groups) == 26, (path, 'fallback group count')
              assert all('proxies' not in g for g in fallback_groups), (path, 'nested fallback returned')
              assert all(g.get('include-all') is True for g in fallback_groups), (path, 'include-all lost')
              assert all(g.get('lazy') is True for g in fallback_groups), (path, 'lazy changed')

              # Keep service and identity group semantics intact.
              by_name = {g['name']: g for g in groups if 'name' in g}
              assert by_name['Proxy']['default-selected'] == 'Fallback', (path, 'Proxy default changed')
              assert by_name['AI']['default-selected'] == 'AI Auto', (path, 'AI default changed')
              assert by_name['RedPocket']['default-selected'] == 'RedPocket Auto', (path, 'RedPocket default changed')
              assert by_name['YouTube Auto']['type'] == 'url-test', (path, 'YouTube Auto changed')

              # Preserve platform-specific runtime behavior.
              if path.endswith('mihomo_pro.yaml'):
                  assert data['dns']['listen'] == '0.0.0.0:1053'
                  assert data['tun']['enable'] is False
                  assert data['tun']['stack'] == 'mixed'
                  assert data['external-controller'] == '127.0.0.1:9090'
                  assert data['find-process-mode'] == 'off'
                  assert data['proxy-providers']['proxy1']['path'] == './proxies/proxy1.yaml'
                  assert data['proxies'] == []
              else:
                  assert data['mixed-port'] == 7890
                  assert data['redir-port'] == 7891
                  assert data['tproxy-port'] == 1536
                  assert data['dns']['listen'] == '0.0.0.0:1053'
                  assert data['tun']['enable'] is False
                  assert data['tun']['stack'] == 'gvisor'
                  assert data['external-controller'] == '0.0.0.0:9090'
                  assert data['find-process-mode'] == 'off'
                  assert data['proxy-providers']['proxy1']['path'] == './proxies/proxy1.yaml'
                  assert data['proxies'] == [{'name': 'DNS Hijack', 'type': 'dns'}]
                  assert data['rules'][0] == 'DST-PORT,53,DNS Hijack'

              print(path)
              print('  YAML OK')
              print('  Proxy groups:', len(groups))
              print('  Fallback groups:', len(fallback_groups))
              print('  Final:', final)
              print('  Last rule:', data['rules'][-1])
          PY

      - name: Verify only intended semantic changes
        shell: bash
        run: |
          git diff --check
          git diff -- Sub-Store/config/mihomo_pro.yaml Sub-Store/config/surfing_pro.yaml

      - name: Commit validated update
        shell: bash
        run: |
          git config user.name "CosmosDiv"
          git config user.email "69336262+CosmosDiv@users.noreply.github.com"
          git rm .github/workflows/promote-mihomo-surfing-final-v4.1.1.yml
          git add Sub-Store/config/mihomo_pro.yaml Sub-Store/config/surfing_pro.yaml
          git commit -m "Add Final catch-all group to Mihomo and Surfing V4.1.1"
          git push origin HEAD:mihomo-surfing-final-v4.1.1
