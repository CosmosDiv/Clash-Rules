name: Promote OpenClash Final V4.1.1

on:
  push:
    branches:
      - openclash-final-v4.1.1
    paths:
      - .github/workflows/promote-openclash-final-v4.1.1.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openclash-final-v4.1.1
          fetch-depth: 0

      - name: Apply Final catch-all and validate
        shell: bash
        run: |
          python -m pip install --quiet pyyaml
          python <<'PY'
          from pathlib import Path
          import yaml

          p = Path('Sub-Store/config/openclash_pro.yaml')
          s = p.read_text(encoding='utf-8')

          assert '# OpenClash / OpenWrt Quality / Identity Routing V4.1.0' in s
          assert '  - name: Final\n' not in s
          assert s.count('  - MATCH,Proxy') == 1

          s = s.replace(
              '# OpenClash / OpenWrt Quality / Identity Routing V4.1.0',
              '# OpenClash / OpenWrt Quality / Identity Routing V4.1.1',
              1,
          )

          old_header = "#   Fallback keeps `lazy: true` and selects the first alive node in the resulting order.\n"
          new_header = old_header + "#   Final catch-all remains proxy-first while exposing a manual Direct override.\n"
          assert old_header in s
          s = s.replace(old_header, new_header, 1)

          direct_block = '''  - name: Direct\n    type: select\n    proxies: [DIRECT]\n    default-selected: DIRECT\n    hidden: true\n    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png"\n'''
          final_block = direct_block + '''  - name: Final\n    type: select\n    proxies: [Proxy, Direct]\n    default-selected: Proxy\n'''
          assert direct_block in s
          s = s.replace(direct_block, final_block, 1)

          old_tail = '  - MATCH,Proxy\n\n# ==================== EOF ====================\n'
          new_tail = '''  # ---------- Final catch-all ----------\n  # Unknown traffic stays proxy-first; switch Final to Direct only when testing/handling domestic edge cases.\n  - MATCH,Final\n\n# ==================== EOF ====================\n'''
          assert old_tail in s
          s = s.replace(old_tail, new_tail, 1)

          p.write_text(s, encoding='utf-8')

          data = yaml.safe_load(s)
          assert data['proxy-groups']
          final_groups = [g for g in data['proxy-groups'] if g.get('name') == 'Final']
          assert len(final_groups) == 1
          final = final_groups[0]
          assert final.get('type') == 'select'
          assert final.get('proxies') == ['Proxy', 'Direct']
          assert final.get('default-selected') == 'Proxy'
          assert data['rules'][-1] == 'MATCH,Final'
          assert 'MATCH,Proxy' not in data['rules']
          assert len(data['x-filter-order-main'].split('`')) == 20

          fallback_groups = [g for g in data['proxy-groups'] if g.get('type') == 'fallback']
          assert all('proxies' not in g for g in fallback_groups)
          assert all(g.get('include-all') is True for g in fallback_groups)

          print('YAML OK')
          print('Proxy groups:', len(data['proxy-groups']))
          print('Fallback groups:', len(fallback_groups))
          print('Final:', final)
          print('Last rule:', data['rules'][-1])
          PY

      - name: Commit validated update
        shell: bash
        run: |
          git config user.name "CosmosDiv"
          git config user.email "69336262+CosmosDiv@users.noreply.github.com"
          git rm .github/workflows/promote-openclash-final-v4.1.1.yml
          git add Sub-Store/config/openclash_pro.yaml
          git commit -m "Add Final catch-all group to OpenClash V4.1.1"
          git push origin HEAD:openclash-final-v4.1.1
