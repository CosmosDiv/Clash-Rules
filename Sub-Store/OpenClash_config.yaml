# ==================== 规则集 ====================
# ==================== rules ====================
rules:
  # ==================== 基础控制：域名规则 ====================

  - RULE-SET,fake-ip-filter_domain,直接连接 # fake-ip域名直连
  - RULE-SET,private_domain,直接连接 # 局域网、保留域名、本地域名直连
  - RULE-SET,dmca_domain,直接连接 # PT/Tracker/迅雷等敏感下载域名直连
  - RULE-SET,httpdns_domain,REJECT # 拦截 HTTPDNS 域名，避免绕过正常分流
  - RULE-SET,adrules_domain,REJECT # 广告与跟踪域名拦截
  # 1. 绝大多数海外 QUIC：通过域名直接拦截
  - AND,((DST-PORT,443),(NETWORK,UDP),(GEOSITE,geolocation-!cn)),REJECT
  # 2. 漏网的海外 QUIC：通过 IP 兜底拦截（允许触发 DNS 解析，接受泄露）
  - AND,((DST-PORT,443),(NETWORK,UDP),(NOT,((GEOIP,CN)))),REJECT

  # ==================== 国内专项：域名规则 ====================

  - RULE-SET,apple_cn_domain,直接连接 # Apple 在大陆可直连域名
  - RULE-SET,microsoft_cn_domain,直接连接 # Microsoft 在大陆可直连域名
  - RULE-SET,bilibili_domain,直接连接 # 哔哩哔哩
  - RULE-SET,douyin_domain,直接连接 # 抖音
  - RULE-SET,socialmedia_cn_domain,直接连接 # 小红书/微博/知乎/豆瓣/Coolapk 等
  - RULE-SET,games_cn_domain,直接连接 # 国内游戏平台与下载
  - RULE-SET,cdn_domain,直接连接 # 常见 CDN、系统更新、大文件下载
  - RULE-SET,cn_domain,直接连接 # 中国大陆域名大兜底

  # ==================== 海外专项：域名规则 ====================
  
  - RULE-SET,gemini_domain,Gemini # Gemini AI 服务
  - RULE-SET,ai_domain,人工智能 # 其它 AI 服务
  - RULE-SET,googlefcm_domain,谷歌服务 # Google 推送
  - RULE-SET,youtube_domain,国际流媒体 # YouTube
  - RULE-SET,google_domain,谷歌服务 # Google 其它服务

  - RULE-SET,apns_domain,苹果服务 # Apple 推送
  - RULE-SET,apple_proxy_domain,苹果服务 # Apple 在大陆需代理的域名
  - RULE-SET,apple_tv_domain,国际流媒体 # Apple TV
  - RULE-SET,apple_domain,苹果服务 # Apple 其它服务

  - RULE-SET,onedrive_domain,网盘服务 # OneDrive
  - RULE-SET,microsoft_domain,微软服务 # Microsoft 其它服务

  - RULE-SET,gits_domain,开发服务 # GitHub/GitLab/GitBook 等开发平台
  - RULE-SET,forum_domain,论坛社区 # Reddit/Quora/PTT/V2EX/4chan 等
  - RULE-SET,socialmedia_domain,社交媒体 # Telegram/X/Discord/Instagram/Facebook 等
  - RULE-SET,games_domain,游戏服务 # 海外游戏平台与下载
  - RULE-SET,tiktok_domain,TikTok # TikTok
  - RULE-SET,talkatone_domain,通信服务 # Talkatone
  - RULE-SET,ecommerce_domain,电商平台 # Amazon/eBay/Shopee/Shopify 等
  - RULE-SET,paypal_domain,PayPal # PayPal
  - RULE-SET,crypto_domain,加密货币 # Binance/OKX/Bybit/Bitget 等

  - RULE-SET,speedtest_domain,网络测试 # 网络测试域名
  
  - RULE-SET,abema_domain,国际流媒体 # Abema
  - RULE-SET,bahamut_domain,国际流媒体 # 巴哈姆特
  - RULE-SET,dazn_domain,国际流媒体 # DAZN
  - RULE-SET,disney_domain,国际流媒体 # Disney+
  - RULE-SET,dmm_domain,国际流媒体 # DMM
  - RULE-SET,hbo_domain,国际流媒体 # HBO
  - RULE-SET,hulu_domain,国际流媒体 # Hulu
  - RULE-SET,mytvsuper_domain,国际流媒体 # MyTV SUPER
  - RULE-SET,netflix_domain,国际流媒体 # Netflix
  - RULE-SET,niconico_domain,国际流媒体 # Niconico
  - RULE-SET,primevideo_domain,国际流媒体 # Prime Video
  - RULE-SET,spotify_domain,国际流媒体 # Spotify
  - RULE-SET,twitch_domain,国际流媒体 # Twitch

  # ==================== 海外兜底：域名规则 ====================

  - RULE-SET,gfw_domain,默认代理 # 常见被墙域名
  - RULE-SET,tld_proxy_domain,默认代理 # 海外顶级域名大兜底
  - RULE-SET,proxy_domain,默认代理 # 海外域名大兜底

  # ==================== 基础控制：IP 规则 ====================

  - RULE-SET,private_ip,直接连接,no-resolve # 局域网、保留地址直连
  - RULE-SET,dmca_ip,直接连接,no-resolve # PT/Tracker/迅雷等敏感下载 IP 直连
  - RULE-SET,httpdns_ip,REJECT,no-resolve # HTTPDNS IP 拦截
  - RULE-SET,adrules_ip,REJECT,no-resolve # 广告与跟踪 IP 拦截

  # ==================== 海外专项：IP 规则 ====================

  - RULE-SET,apns_ip,苹果服务,no-resolve # Apple 推送 IP
  - RULE-SET,apple_ip,苹果服务,no-resolve # Apple 服务 IP
  - RULE-SET,dmm_ip,国际流媒体,no-resolve # DMM IP
  - RULE-SET,ecommerce_ip,电商平台,no-resolve # 电商平台 IP
  - RULE-SET,games_ip,游戏服务,no-resolve # 海外游戏平台 IP
  - RULE-SET,gfw_ip,默认代理,no-resolve # 被墙站点常见 IP
  - RULE-SET,googlefcm_ip,谷歌服务,no-resolve # Google 推送 IP
  - RULE-SET,google_ip,谷歌服务,no-resolve # Google 服务 IP
  - RULE-SET,netflix_ip,国际流媒体,no-resolve # Netflix IP
  - RULE-SET,socialmedia_ip,社交媒体,no-resolve # 海外社交媒体 IP
  - RULE-SET,spotify_ip,国际流媒体,no-resolve # Spotify IP
  - RULE-SET,talkatone_ip,通信服务,no-resolve # Talkatone IP
  - RULE-SET,twitch_ip,国际流媒体,no-resolve # Twitch IP
  - RULE-SET,youtube_ip,国际流媒体,no-resolve # YouTube IP

  # ==================== 国内专项：IP 规则 ====================

  - RULE-SET,bilibili_ip,直接连接,no-resolve # 哔哩哔哩 IP
  - RULE-SET,socialmedia_cn_ip,直接连接,no-resolve # 国内社交媒体 IP

  # ==================== 国内 / 海外 IP 大兜底 ====================

  - RULE-SET,proxy_ip,默认代理,no-resolve # 海外 IP 大兜底；尽量先接住需要代理的海外连接，减少不必要解析
  - RULE-SET,cn_ip,直接连接 # 中国大陆 IP 大兜底；不加 no-resolve，承接剩余流量并尽量识别国内解析结果

  # ==================== 最终兜底 ====================
  - MATCH,兜底流量 # 其它漏网流量统一交给默认代理策略

# 规则集行为模板
