# PY默认代理组的分组排序
SelectPY: &SelectPY {type: select, proxies: [默认代理, 故障转移, 香港策略, 狮城策略, 日本策略, 韩国策略, 美国策略, 台湾策略, 英国策略, 欧盟策略, 冷门自选, 家宽手动, 全球手动, 直接连接]}
