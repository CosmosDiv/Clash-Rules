# ==================== 锚点配置 ====================
# 代理提供者模板 - 订阅源基础配置
BaseHealthCheck: &BaseHealthCheck {enable: true, url: 'https://cp.cloudflare.com', interval: 300, timeout: 5000, lazy: true}
BaseProviderOverride: &BaseProviderOverride {udp: true, skip-cert-verify: true}
BaseProvider: &BaseProvider {type: http, interval: 86400, proxy: DIRECT, health-check: *BaseHealthCheck}

# 策略组类型模板 - 定义不同的策略组基础配置
# FB：fallback故障转移分组的锚点引用
BaseFB: &BaseFB {type: fallback, interval: 200, lazy: true, url: 'https://www.google.com/generate_204'}
# UT:url-test测速分组的锚点引用
BaseUT: &BaseUT {type: url-test, interval: 200, lazy: true, url: 'https://www.google.com/generate_204', hidden: true}
# smart智能分组的锚点引用,不适用lgbm模型，收集数据。如果要换，就可以这样，全局搜索baseut换成这个，这样把自动测速都换成智能。
BaseSmart: &BaseSmart {type: smart, interval: 200, lazy: true, url: 'https://www.google.com/generate_204', hidden: true, uselightgbm: false, collectdata: true}

# 节点筛选正则表达式 - 基于地理位置和关键词过滤
# (?!.*(家宽|住宅|5G网络|星链)这个部分为排除内容。
FilterHK: &FilterHK '(?i)^(?=.*(港|🇭🇰|HK|Hong|HKG))(?!.*(家宽|住宅|5G网络|星链)).*$'
FilterHKHome: &FilterHKHome '(?i)^(?=.*(港|🇭🇰|HK|Hong|HKG))(?=.*(家宽|住宅|5G网络|星链)).*$'
FilterSG: &FilterSG '(?i)^(?=.*(坡|🇸🇬|SG|Sing|SIN|XSP))(?!.*(家宽|住宅|5G网络|星链)).*$'
FilterSGHome: &FilterSGHome '(?i)^(?=.*(坡|🇸🇬|SG|Sing|SIN|XSP))(?=.*(家宽|住宅|5G网络|星链)).*$'
FilterJP: &FilterJP '(?i)^(?=.*(日|🇯🇵|JP|Japan|NRT|HND|KIX|CTS|FUK))(?!.*(家宽|住宅|5G网络|星链)).*$'
FilterJPHome: &FilterJPHome '(?i)^(?=.*(日|🇯🇵|JP|Japan|NRT|HND|KIX|CTS|FUK))(?=.*(家宽|住宅|5G网络|星链)).*$'
FilterKR: &FilterKR '(?i)^(?=.*(韩|🇰🇷|韓|首尔|南朝鲜|KR|KOR|Korea|South))(?!.*(家宽|住宅|5G网络|星链)).*$'
FilterKRHome: &FilterKRHome '(?i)^(?=.*(韩|🇰🇷|韓|首尔|南朝鲜|KR|KOR|Korea|South))(?=.*(家宽|住宅|5G网络|星链)).*$'
FilterUS: &FilterUS '(?i)^(?=.*(美|🇺🇸|US|USA|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD))(?!.*(家宽|住宅|5G网络|星链)).*$'
FilterUSHome: &FilterUSHome '(?i)^(?=.*(美|🇺🇸|US|USA|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD))(?=.*(家宽|住宅|5G网络|星链)).*$'
FilterTW: &FilterTW '(?i)^(?=.*(台|🇼🇸|🇹🇼|TW|tai|TPE|TSA|KHH))(?!.*(家宽|住宅|5G网络|星链)).*$'
FilterTWHome: &FilterTWHome '(?i)^(?=.*(台|🇼🇸|🇹🇼|TW|tai|TPE|TSA|KHH))(?=.*(家宽|住宅|5G网络|星链)).*$'
FilterUK: &FilterUK '(?i)^(?=.*(英|英国|UK|大不列颠|伦敦|Kingdom))(?!.*(家宽|住宅|5G网络|星链)).*$'
FilterUKHome: &FilterUKHome '(?i)^(?=.*(英|英国|UK|大不列颠|伦敦|Kingdom))(?=.*(家宽|住宅|5G网络|星链)).*$'
FilterEU: &FilterEU '(?i)^(?=.*(奥|比|保|克罗地亚|塞|捷|丹|爱沙|芬|法|德|希|匈|爱尔|意|拉|立|卢|马其它|荷|波|葡|罗|斯洛伐|斯洛文|西|瑞|英|🇧🇪|🇨🇿|🇩🇰|🇫🇮|🇫🇷|🇩🇪|🇮🇪|🇮🇹|🇱🇹|🇱🇺|🇳🇱|🇵🇱|🇸🇪|🇬🇧|CDG|FRA|AMS|MAD|BCN|FCO|MUC|BRU))(?!.*(家宽|住宅|5G网络|星链)).*$'
FilterEUHome: &FilterEUHome '(?i)^(?=.*(奥|比|保|克罗地亚|塞|捷|丹|爱沙|芬|法|德|希|匈|爱尔|意|拉|立|卢|马其它|荷|波|葡|罗|斯洛伐|斯洛文|西|瑞|英|🇧🇪|🇨🇿|🇩🇰|🇫🇮|🇫🇷|🇩🇪|🇮🇪|🇮🇹|🇱🇹|🇱🇺|🇳🇱|🇵🇱|🇸🇪|🇬🇧|CDG|FRA|AMS|MAD|BCN|FCO|MUC|BRU))(?=.*(家宽|住宅|5G网络|星链)).*$'
# 家宽节点的筛选
FilterHM: &FilterHM '^(?=.*(?i:家宽|住宅|5G网络|星链)).*$'
# ot是other，是其他节点分组的意思
FilterOT: &FilterOT '^(?!.*(DIRECT|直接连接|美|港|坡|台|新|日|韩|奥|比|保|克罗地亚|塞|捷|丹|爱沙|芬|法|德|希|匈|爱尔|意|拉|立|卢|马其它|荷|波|葡|罗|斯洛伐|斯洛文|西|瑞|英|🇭🇰|🇼🇸|🇹🇼|🇸🇬|🇯🇵|🇰🇷|🇺🇸|🇬🇧|🇦🇹|🇧🇪|🇨🇿|🇩🇰|🇫🇮|🇫🇷|🇩🇪|🇮🇪|🇮🇹|🇱🇹|🇱🇺|🇳🇱|🇵🇱|🇸🇪|HK|TW|SG|JP|KR|US|GB|CDG|FRA|AMS|MAD|BCN|FCO|MUC|BRU|HKG|TPE|TSA|KHH|SIN|XSP|NRT|HND|KIX|CTS|FUK|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD|LHR|LGW))'
FilterAL: &FilterAL '^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))'

# 策略组代理列表模板 - 预定义的代理节点优先级排序
