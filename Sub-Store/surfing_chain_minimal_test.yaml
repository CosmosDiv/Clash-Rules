# Minimal chain proxy test profile.
# Purpose: verify US residential exits chained through 落地前置.

# Plain US/HK nodes used as front proxies. Explicitly exclude residential nodes.
FilterUS: &FilterUS '(?i)^(?=.*(美|美国|🇺🇸|USA|(?:^|[^A-Za-z])US(?:[^A-Za-z]|$)|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD))(?!.*(家宽|住宅|5G网络|星链)).*$'
FilterHK: &FilterHK '(?i)^(?=.*(港|香港|🇭🇰|HK|Hong|HKG|澳门|澳門|🇲🇴|Macao|Macau|MFM|(?:^|[^A-Za-z])MO(?:[^A-Za-z]|$)))(?!.*(家宽|住宅|5G网络|星链)).*$'

# US residential exits. These nodes should receive dialer-proxy: 落地前置 from Sub-Store.
FilterUSHome: &FilterUSHome '(?i)^(?=.*(美|美国|🇺🇸|USA|(?:^|[^A-Za-z])US(?:[^A-Za-z]|$)|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD))(?=.*(家宽|住宅|5G网络|星链)).*$'

# ==================== Proxy Provider ====================
proxy-providers:
  proxy1:
    type: http
    interval: 86400
    proxy: DIRECT
    header:
      User-Agent:
        - "ClashMetaForAndroid/2.11.2.Meta"
        - "clash-verge/v2.2.3"
        - "ClashforWindows/0.19.23"
        - "clash.meta"
        - "mihomo"
    health-check:
      enable: false
    url: ""
    path: ./proxies/proxy1.yaml

# ==================== GeoData ====================
geox-url:
  mmdb: "https://testingcf.jsdelivr.net/gh/alecthw/mmdb_china_ip_list@release/Country.mmdb"
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  asn: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/geoip@release/GeoLite2-ASN.mmdb"

geo-auto-update: true
geo-update-interval: 24
geodata-mode: true

# ==================== Core ====================
mixed-port: 7890
redir-port: 7891
tproxy-port: 1536
mode: rule
ipv6: true
allow-lan: true
disable-keep-alive: true
unified-delay: true
tcp-concurrent: true
log-level: debug
find-process-mode: always
bind-address: "*"
keep-alive-interval: 15
keep-alive-idle: 600

external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui: "./webroot/Zash/"
external-controller: 0.0.0.0:9090
secret: "yyds666"

profile:
  store-selected: false
  store-fake-ip: false

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

tun:
  enable: false
  device: Meta
  stack: gvisor
  dns-hijack:
    - any:53
    - tcp://any:53
  udp-timeout: 300
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true

dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdab:47c2:9e1f:9876::1/64
  default-nameserver:
    - 119.29.29.29
    - 180.184.1.1
    - 223.5.5.5
  nameserver:
    - https://223.5.5.5/dns-query#h3=true
    - https://dns.alidns.com/dns-query
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - "+.pub.3gppnetwork.org"
    - "+.bing.com"
    - "+.miwifi.com"
    - "+.push.apple.com"

# ==================== Proxy Groups ====================
proxy-groups:
  # Fix one residential exit B for each test.
  - {name: 海外流量, type: select, proxies: [美宽手动], icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png"}

  # Fix one front proxy A for each test. Residential exit nodes reference this group through dialer-proxy.
  - {name: 落地前置, type: select, proxies: [美国手动, 香港手动], icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"}

  # Residential exit B.
  - {name: 美宽手动, type: select, include-all: true, filter: *FilterUSHome, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png"}

  # Front proxy A candidates. These groups intentionally exclude residential nodes.
  - {name: 美国手动, type: select, include-all: true, filter: *FilterUS, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png"}
  - {name: 香港手动, type: select, include-all: true, filter: *FilterHK, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png"}

# ==================== Rules ====================
rules:
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOSITE,cn,DIRECT
  - GEOSITE,geolocation-!cn,海外流量
  - GEOIP,CN,DIRECT,no-resolve
  - NOT,((GEOIP,CN)),海外流量
  - MATCH,海外流量
