# ==================== 08. Rules ====================
rules:
  # ---------- Unconditional local KVM exception ----------
  - DOMAIN-SUFFIX,glkvm.cn,DIRECT
  # ---------- Private and Apple push: direct ----------
  - RULE-SET,QuixPrivate,DIRECT
  - RULE-SET,QuixPrivateIP,DIRECT,no-resolve
  - RULE-SET,QuixAPNS,Direct Switch
  - RULE-SET,QuixAPNSIP,Direct Switch,no-resolve
  # ---------- Ad / tracker / HTTPDNS blocking ----------
  - RULE-SET,QuixAdrules,REJECT
  - RULE-SET,QuixAdrulesIP,REJECT,no-resolve
  # ---------- AI has highest ordinary service priority ----------
  - RULE-SET,QuixAI,AI
