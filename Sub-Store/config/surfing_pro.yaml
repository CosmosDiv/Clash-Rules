# ============================================================================
# Surfing / Android Magisk Quality / Identity Routing V5.0.0
# Target: Surfing + Mihomo v1.19.30+
#
# Ordinary nodes: Node Standardizer V2.1.5 -> IPQuality V1.4.4 -> Mihomo
# Chain nodes:    Node Standardizer V2.1.5 -> IPQuality V1.4.4 (auto bypass) -> Mihomo
#
# Policy architecture:
#   Ordinary region groups are Select -> Auto / Manual; Auto uses Trust + Normal URL-Test.
#   A single global Fallback serves Proxy for ordered cross-region failover.
#   Ordinary services use ordered Select groups and do not own Fallback groups.
#   AI / SIM Service prefer Chain, then Trust-only sensitive region selectors.
#   Front Proxy: COS US Auto / COS Stable / COS Auto (default) / US Front Auto / Front Stable / Proxy / Front Manual.
#   Direct Switch can be manually switched between DIRECT and Proxy.
#   Automated URL-Test / Fallback groups are hidden; manually controllable Select groups remain visible.
#   Fallback and URL-Test share one gstatic generate_204 probe target.
#   Surfing keeps tcp-concurrent disabled for platform stability.
#
# Node source compatibility:
#   Both Sub-Store static-node injection and proxy-provider mode are supported.
#   `include-all: true` allows the same policy layer to consume either source mode.
#   Static-node mode must preserve Surfing's internal `DNS Hijack` outbound.
#
# Surfing runtime:
#   Android TPROXY/REDIRECT integration and DNS/53 hijack stay platform-specific;
#   Mihomo TUN remains disabled by default.
# ============================================================================

# ==================== 00. User Configuration ====================
x-user-config:
  provider-url: &provider-url ""
  provider-path: &provider-path ./proxies/proxy1.yaml
  provider-update-interval: &provider-update-interval 86400

  # One stable probe target for both failover health and latency comparison.
  health-url: &health-url https://www.gstatic.com/generate_204
  latency-url: &latency-url https://www.gstatic.com/generate_204
  test-interval: &test-interval 300
  test-timeout: &test-timeout 5000
  test-tolerance: &test-tolerance 50
  front-test-tolerance: &front-test-tolerance 100

  rule-update-interval: &rule-update-interval 86400


# ==================== 01. Reusable Templates ====================
x-fallback: &fallback
  type: fallback
  interval: *test-interval
  lazy: true
  hidden: true
  url: *health-url
  timeout: *test-timeout
  expected-status: 204
  empty-fallback: REJECT

x-url-test: &url-test
  type: url-test
  include-all: true
  interval: *test-interval
  tolerance: *test-tolerance
  lazy: true
  hidden: true
  url: *latency-url
  timeout: *test-timeout
  expected-status: 204
  empty-fallback: REJECT

# Front URL-Test favors stability over small latency differences.
x-front-url-test: &front-url-test
  <<: *url-test
  tolerance: *front-test-tolerance

x-select-nodes: &select-nodes
  type: select
  include-all: true
  empty-fallback: REJECT

# ==================== 02. Node Filters ====================
# IPQuality V1.4.4 contract:
#   Auto   -> Trust | Normal
#   Usable -> Trust | Normal | Unrated (Manual / Front)
#   Trust  -> multi-source clean reputation; independent from ISPIP / HostIP identity
#   Risk   -> removed by IPQuality in normal production mode
# Network identity (ISPIP / HostIP / UnkIP) remains node metadata and is not required by policy groups.
x-filter-chain: &filter-chain '(?i)^US @Chain-[^ ｜]+(?: |｜|$)`(?i)^JP @Chain-[^ ｜]+(?: |｜|$)`(?i)^SG @Chain-[^ ｜]+(?: |｜|$)`(?i)^(?!(?:US|JP|SG) )(?:[A-Z]{2}|Multi|Unknown) @Chain-[^ ｜]+(?: |｜|$)'
x-exclude-special: &exclude-special '(?i)(?:^(?:[A-Z]{2}|Multi|Unknown) @Chain-[^ ｜]+(?: |｜|$)|｜Egress(?:\s+\d+)?(?:\s+TLS)?$)'
x-filter-egress: &filter-egress '(?i)｜Egress(?:\s+\d+)?(?:\s+TLS)?$'

x-filter-hk-auto: &filter-hk-auto '(?i)^HK (?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$)).*$'
x-filter-hk-usable: &filter-hk-usable '(?i)^HK (?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'

x-filter-tw-auto: &filter-tw-auto '(?i)^TW (?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$)).*$'
x-filter-tw-usable: &filter-tw-usable '(?i)^TW (?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'
x-filter-tw-trust: &filter-tw-trust '(?i)^TW (?=[^｜]*[ ·]Trust(?:[·｜]|$)).*$'

x-filter-sg-auto: &filter-sg-auto '(?i)^SG (?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$)).*$'
x-filter-sg-usable: &filter-sg-usable '(?i)^SG (?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'
x-filter-sg-trust: &filter-sg-trust '(?i)^SG (?=[^｜]*[ ·]Trust(?:[·｜]|$)).*$'

x-filter-jp-auto: &filter-jp-auto '(?i)^JP (?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$)).*$'
x-filter-jp-usable: &filter-jp-usable '(?i)^JP (?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'
x-filter-jp-trust: &filter-jp-trust '(?i)^JP (?=[^｜]*[ ·]Trust(?:[·｜]|$)).*$'

x-filter-kr-auto: &filter-kr-auto '(?i)^KR (?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$)).*$'
x-filter-kr-usable: &filter-kr-usable '(?i)^KR (?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'

x-filter-us-auto: &filter-us-auto '(?i)^US (?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$)).*$'
x-filter-us-usable: &filter-us-usable '(?i)^US (?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'
x-filter-us-trust: &filter-us-trust '(?i)^US (?=[^｜]*[ ·]Trust(?:[·｜]|$)).*$'

x-filter-ca-auto: &filter-ca-auto '(?i)^CA (?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$)).*$'
x-filter-ca-usable: &filter-ca-usable '(?i)^CA (?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'

x-filter-au-auto: &filter-au-auto '(?i)^AU (?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$)).*$'
x-filter-au-usable: &filter-au-usable '(?i)^AU (?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'

x-filter-uk-auto: &filter-uk-auto '(?i)^UK (?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$)).*$'
x-filter-uk-usable: &filter-uk-usable '(?i)^UK (?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'

x-filter-eu-auto: &filter-eu-auto '(?i)^(?:AT|BE|BG|CY|CZ|DE|DK|EE|ES|FI|FR|GR|HR|HU|IE|IT|LT|LU|LV|MT|NL|PL|PT|RO|SE|SI|SK) (?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$)).*$'
x-filter-eu-usable: &filter-eu-usable '(?i)^(?:AT|BE|BG|CY|CZ|DE|DK|EE|ES|FI|FR|GR|HR|HU|IE|IT|LT|LU|LV|MT|NL|PL|PT|RO|SE|SI|SK) (?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'

# COS front pools use @COS-* source matching without quality-tag restrictions.
x-filter-cos: &filter-cos '(?i)^(?:[A-Z]{2}|Multi|Unknown) @COS-[^ ｜]+(?: |｜|$)'
x-filter-cos-us: &filter-cos-us '(?i)^US @COS-[^ ｜]+(?: |｜|$)'
x-filter-cos-stable: &filter-cos-stable '(?i)^US @COS-[^ ｜]+(?: |｜|$)`(?i)^HK @COS-[^ ｜]+(?: |｜|$)`(?i)^TW @COS-[^ ｜]+(?: |｜|$)`(?i)^SG @COS-[^ ｜]+(?: |｜|$)`(?i)^JP @COS-[^ ｜]+(?: |｜|$)`(?i)^KR @COS-[^ ｜]+(?: |｜|$)`(?i)^CA @COS-[^ ｜]+(?: |｜|$)`(?i)^AU @COS-[^ ｜]+(?: |｜|$)`(?i)^UK @COS-[^ ｜]+(?: |｜|$)`(?i)^(?:AT|BE|BG|CY|CZ|DE|DK|EE|ES|FI|FR|GR|HR|HU|IE|IT|LT|LU|LV|MT|NL|PL|PT|RO|SE|SI|SK) @COS-[^ ｜]+(?: |｜|$)`(?i)^(?!(?:US|HK|TW|SG|JP|KR|CA|AU|UK|AT|BE|BG|CY|CZ|DE|DK|EE|ES|FI|FR|GR|HR|HU|IE|IT|LT|LU|LV|MT|NL|PL|PT|RO|SE|SI|SK) )(?:[A-Z]{2}|Multi|Unknown) @COS-[^ ｜]+(?: |｜|$)'
# Ordinary Front Stable keeps the historical fallback order: regional Trust, then regional Normal.
x-filter-front-stable: &filter-front-stable '(?i)^US (?=[^｜]*[ ·]Trust(?:[·｜]|$)).*$`(?i)^HK (?=[^｜]*[ ·]Trust(?:[·｜]|$)).*$`(?i)^TW (?=[^｜]*[ ·]Trust(?:[·｜]|$)).*$`(?i)^SG (?=[^｜]*[ ·]Trust(?:[·｜]|$)).*$`(?i)^JP (?=[^｜]*[ ·]Trust(?:[·｜]|$)).*$`(?i)^KR (?=[^｜]*[ ·]Trust(?:[·｜]|$)).*$`(?i)^CA (?=[^｜]*[ ·]Trust(?:[·｜]|$)).*$`(?i)^AU (?=[^｜]*[ ·]Trust(?:[·｜]|$)).*$`(?i)^UK (?=[^｜]*[ ·]Trust(?:[·｜]|$)).*$`(?i)^(?:AT|BE|BG|CY|CZ|DE|DK|EE|ES|FI|FR|GR|HR|HU|IE|IT|LT|LU|LV|MT|NL|PL|PT|RO|SE|SI|SK) (?=[^｜]*[ ·]Trust(?:[·｜]|$)).*$`(?i)^US (?=[^｜]*[ ·]Normal(?:[·｜]|$)).*$`(?i)^HK (?=[^｜]*[ ·]Normal(?:[·｜]|$)).*$`(?i)^TW (?=[^｜]*[ ·]Normal(?:[·｜]|$)).*$`(?i)^SG (?=[^｜]*[ ·]Normal(?:[·｜]|$)).*$`(?i)^JP (?=[^｜]*[ ·]Normal(?:[·｜]|$)).*$`(?i)^KR (?=[^｜]*[ ·]Normal(?:[·｜]|$)).*$`(?i)^CA (?=[^｜]*[ ·]Normal(?:[·｜]|$)).*$`(?i)^AU (?=[^｜]*[ ·]Normal(?:[·｜]|$)).*$`(?i)^UK (?=[^｜]*[ ·]Normal(?:[·｜]|$)).*$`(?i)^(?:AT|BE|BG|CY|CZ|DE|DK|EE|ES|FI|FR|GR|HR|HU|IE|IT|LT|LU|LV|MT|NL|PL|PT|RO|SE|SI|SK) (?=[^｜]*[ ·]Normal(?:[·｜]|$)).*$'

x-filter-all-usable: &filter-all-usable '(?i)^(?:[A-Z]{2}|Multi|Unknown) @(?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'
x-filter-youtube-bulk: &filter-youtube-bulk '(?i)^(?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$))(?=[^｜]*[ ·]Bulk(?:[·｜]|$)).*$'
x-filter-youtube-auto: &filter-youtube-auto '(?i)^(?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$))(?=[^｜]*[ ·]Bulk(?:[·｜]|$))(?=[^｜]*[ ·](?:0(?:\.\d+)?|1(?:\.0+)?)x(?:[·｜]|$)).*$'

# Historical ordered real-node fallback pattern; consumes both static nodes and providers.
x-node-fallback: &node-fallback
  <<: *fallback
  include-all: true
  exclude-filter: *exclude-special

# ==================== 03. Proxy Sources ====================
# Surfing TPROXY sends traditional DNS/53 traffic back to Mihomo DNS via this internal proxy.
# If Sub-Store injects static nodes into `proxies:`, preserve this entry.
proxies:
  - name: DNS Hijack
    type: dns

proxy-providers:
  proxy1:
    type: http
    url: *provider-url
    path: *provider-path
    interval: *provider-update-interval
    header:
      User-Agent:
        - "ClashMetaForAndroid/2.11.2.Meta"
        - "clash-verge/v2.2.3"
        - "ClashforWindows/0.19.23"
        - "clash.meta"
        - "mihomo"
    health-check:
      enable: false

# ==================== 04. Surfing Runtime ====================
geox-url:
  mmdb: "https://testingcf.jsdelivr.net/gh/alecthw/mmdb_china_ip_list@release/Country.mmdb"
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  asn: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/geoip@release/GeoLite2-ASN.mmdb"
geo-auto-update: true
geo-update-interval: 24
geodata-mode: true
geodata-loader: standard

mixed-port: 7890
redir-port: 7891
tproxy-port: 1536
mode: rule
ipv6: true
allow-lan: true
disable-keep-alive: true
unified-delay: true
tcp-concurrent: false
log-level: warning
find-process-mode: 'off'
bind-address: '*'

experimental:
  quic-go-disable-gso: false

external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
external-ui: "./webroot/Zash/"
external-controller: 0.0.0.0:9090
secret: yyds666

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 5228, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "Mijia Cloud"
    - "+.io.mi.com"
    - "+.push.apple.com"

# ---------- TUN ----------
tun:
  enable: false
  device: Meta
  stack: gvisor
  dns-hijack:
    - any:53
    - tcp://any:53
  udp-timeout: 300
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true

# ---------- DNS ----------
dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-range6: fdab:47c2:9e1f:9876::1/64
  cache-algorithm: arc
  default-nameserver:
    - 119.29.29.29
    - 180.184.1.1
    - 223.5.5.5
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:QuixFakeIpFilter"
    - "+.lan"
    - "*.local"
    - "+.miwifi.com"
    - "+.market.xiaomi.com"
    - "+.push.apple.com"
    - "+.pub.3gppnetwork.org"

# ==================== 05. Proxy Groups ====================
proxy-groups:
  # ---------- Core ----------
  - name: Proxy
    type: select
    proxies: [Fallback, HK, TW, SG, JP, KR, US, CA, AU, UK, EU, All Nodes]
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
  - name: Fallback
    <<: *fallback
    proxies: [HK Auto, TW Auto, SG Auto, JP Auto, KR Auto, US Auto, CA Auto, AU Auto, UK Auto, EU Auto]
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available.png"
  - name: Direct Switch
    type: select
    proxies: [DIRECT, Proxy]
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png"
  - name: Final
    type: select
    proxies: [Proxy, Direct Switch]
  - name: All Nodes
    <<: *select-nodes
    filter: *filter-all-usable
    exclude-filter: *exclude-special
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
  - name: Speedtest
    type: select
    proxies: [Direct Switch, Proxy, HK, TW, SG, JP, KR, US, CA, AU, UK, EU]
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Speedtest.png"

  # ---------- Front / Chain ----------
  # @COS-* is reserved for COS-only front pools; ordinary pools include COS; Chain and Egress are excluded.
  # Chain landings keep dialer-proxy: Front Proxy from substore_Chain.js.
  - name: Front Proxy
    type: select
    proxies: [COS US Auto, COS Stable, COS Auto, US Front Auto, Front Stable, Proxy, Front Manual]
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"

  - name: COS US Auto
    <<: *front-url-test
    filter: *filter-cos-us
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"

  - name: COS Stable
    <<: *fallback
    include-all: true
    filter: *filter-cos-stable
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available.png"

  - name: COS Auto
    <<: *front-url-test
    filter: *filter-cos
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"

  - name: US Front Auto
    <<: *front-url-test
    filter: *filter-us-usable
    exclude-filter: *exclude-special
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"

  - name: Front Stable
    <<: *node-fallback
    filter: *filter-front-stable
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available.png"

  - name: Front Manual
    <<: *select-nodes
    filter: *filter-all-usable
    exclude-filter: *exclude-special
    hidden: true
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"

  - name: Chain
    <<: *select-nodes
    filter: *filter-chain
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Server.png"

  # ---------- Sensitive Services ----------
  - name: AI
    type: select
    proxies: [Chain, Egress Auto, US Sensitive, JP Sensitive, TW Sensitive, SG Sensitive, Proxy]
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ChatGPT.png"
  - name: Egress Auto
    <<: *url-test
    filter: *filter-egress
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"

  - name: SIM Service
    type: select
    proxies: [Chain, US Sensitive, US, Proxy]
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png"

  - name: US Sensitive
    type: select
    proxies: [US Trust, US Auto]
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png"
  - name: US Trust
    <<: *url-test
    filter: *filter-us-trust
    exclude-filter: *exclude-special
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"

  - name: JP Sensitive
    type: select
    proxies: [JP Trust, JP Auto]
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/JP.png"
  - name: JP Trust
    <<: *url-test
