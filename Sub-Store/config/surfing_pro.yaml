# ==================== 03. Proxy Sources ====================
# Surfing TPROXY sends traditional DNS/53 traffic back to Mihomo DNS via this internal proxy.
# If Sub-Store injects static nodes into `proxies:`, preserve this entry.
proxies:
  - name: DNS Hijack
    type: dns

proxy-providers:
  proxy1:
    type: http
    url: *provider-url
    path: *provider-path
    interval: *provider-update-interval
    proxy: DIRECT
    header:
      User-Agent:
        - "ClashMetaForAndroid/2.11.2.Meta"
        - "clash-verge/v2.2.3"
        - "ClashforWindows/0.19.23"
        - "clash.meta"
        - "mihomo"
    # Policy url-test/fallback groups already perform health checks.
    health-check:
      enable: false

# ==================== 04. Surfing Runtime ====================
geox-url:
  mmdb: "https://testingcf.jsdelivr.net/gh/alecthw/mmdb_china_ip_list@release/Country.mmdb"
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  asn: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/geoip@release/GeoLite2-ASN.mmdb"
geo-auto-update: true
geo-update-interval: 24
# V4 rules still contain GEOSITE/GEOIP fallbacks, so keep GeoData enabled on Surfing.
geodata-mode: true
# Android devices running Surfing normally have enough RAM; prefer the standard loader.
geodata-loader: standard

# Surfing module port layout.
mixed-port: 7890
redir-port: 7891
tproxy-port: 1536
mode: rule
ipv6: true
allow-lan: true
# Retain the Surfing module's own keep-alive behavior.
disable-keep-alive: true
unified-delay: true
# Retain the tested Surfing Chain behavior; do not generalize desktop/router TCP concurrency here.
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
bind-address: '*'

experimental:
  quic-go-disable-gso: false

# ---------- Dashboard ----------
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
external-ui: "./webroot/Zash/"
external-controller: 0.0.0.0:9090
secret: yyds666

profile:
  store-selected: true
  store-fake-ip: true

# ---------- Sniffer ----------
# These two mapping options follow Surfing's current official Mihomo template.
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 5228, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "Mijia Cloud"
    - "+.io.mi.com"
    - "+.push.apple.com"

# ---------- TUN ----------
# Surfing handles transparent proxying outside Mihomo TUN by default.
tun:
  enable: false
  device: Meta
  stack: gvisor
  dns-hijack:
    - any:53
    - tcp://any:53
  udp-timeout: 300
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true

# ---------- DNS ----------
dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-range6: fdab:47c2:9e1f:9876::1/64
  cache-algorithm: arc
  default-nameserver:
    - 119.29.29.29
    - 180.184.1.1
    - 223.5.5.5
  # Keep the DNS model deliberately simple, matching the V4 project architecture.
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - "+.lan"
    - "*.local"
    - "+.miwifi.com"
    - "+.market.xiaomi.com"
    - "+.push.apple.com"
    - "+.pub.3gppnetwork.org"

# ==================== 05. Proxy Groups ====================
proxy-groups:
