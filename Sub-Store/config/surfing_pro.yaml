    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
  - name: Fallback
    <<: *fallback
    proxies: [HK Trust Auto, TW Trust Auto, SG Trust Auto, JP Trust Auto, KR Trust Auto, US Trust Auto, CA Trust Auto, AU Trust Auto, UK Trust Auto, EU Trust Auto, HK Normal Auto, TW Normal Auto, SG Normal Auto, JP Normal Auto, KR Normal Auto, US Normal Auto, CA Normal Auto, AU Normal Auto, UK Normal Auto, EU Normal Auto]
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available.png"
  - name: Direct
    type: select
    proxies: [DIRECT]
    default-selected: DIRECT
    hidden: true
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png"
  - name: All Nodes
    <<: *select-nodes
    filter: *filter-all-ordinary
    exclude-filter: *exclude-chain
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
  - name: Speedtest
