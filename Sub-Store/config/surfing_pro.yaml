# ============================================================================
# Surfing / Android Magisk Quality / Identity Routing V4.0.1
# Target: Surfing + Mihomo v1.19.30+
#
# Ordinary nodes: Node Standardizer V2.1.5 -> IPQuality V1.1.1 -> Mihomo
# Chain nodes:    Node Standardizer V2.1.5 -> IPQuality V1.1.1 (auto bypass) -> Mihomo
#
# Node source modes (provider mode recommended on Surfing):
#   1. One Sub-Store/GitHub URL in `proxy-providers.proxy1.url`
#   2. Static nodes may be appended under `proxies:`; keep the internal DNS Hijack proxy
# Surfing owns Android TPROXY/REDIRECT integration; Mihomo TUN remains disabled.
# Policy groups and rules follow the bare-core V4.0.1 project.
# ============================================================================

# ==================== 00. User Configuration ====================
# Normal maintenance should start here.
x-user-config:
  provider-url: &provider-url ""
  provider-path: &provider-path ./proxies/proxy1.yaml
  provider-update-interval: &provider-update-interval 86400

  test-url: &test-url https://www.gstatic.com/generate_204
  test-interval: &test-interval 600
  test-timeout: &test-timeout 3000
  test-tolerance: &test-tolerance 80

  rule-update-interval: &rule-update-interval 86400


# ==================== 01. Reusable Templates ====================
x-fallback: &fallback
  type: fallback
  interval: *test-interval
  lazy: true
  url: *test-url
  timeout: *test-timeout
  expected-status: 204
  empty-fallback: REJECT

x-url-test: &url-test
  type: url-test
  include-all: true
  interval: *test-interval
  tolerance: *test-tolerance
  lazy: true
  url: *test-url
  timeout: *test-timeout
  expected-status: 204
  empty-fallback: REJECT

x-select-nodes: &select-nodes
  type: select
  include-all: true
  empty-fallback: REJECT

