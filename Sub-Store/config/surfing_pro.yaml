# ==================== 08. Rules ====================
rules:
  # ---------- Surfing DNS Hijack ----------
  - DST-PORT,53,DNS Hijack

  # ---------- Local override ----------
  - DOMAIN-SUFFIX,glkvm.cn,DIRECT

  # ---------- Blocking ----------
  - RULE-SET,Tracking,REJECT
  - RULE-SET,Advertising,REJECT

  # ---------- Local / Direct ----------
  - RULE-SET,Private,Direct
  - RULE-SET,Direct,Direct
  - RULE-SET,XPTV,Direct
  - RULE-SET,Download,Direct

  # Apple direct-safe rules must precede broad Apple.
  - RULE-SET,AppleUpdate,Direct
  - RULE-SET,AppleCNMeta,Direct
  - RULE-SET,AppleCN,Direct

  # ---------- RedPocket ----------
  - RULE-SET,RedPocket,RedPocket

  # ---------- YouTube ----------
  # Must precede broad Google because Google collections can include YouTube assets.
  - RULE-SET,YouTube,YouTube

  # ---------- AI exact ----------
  # Four core services keep precise MRS before broad AI aggregation.
  - RULE-SET,MetaOpenAI,AI
  - RULE-SET,MetaAnthropic,AI
  - RULE-SET,MetaGemini,AI
  - RULE-SET,MetaXAI,AI

  # ---------- AI broad / Google ----------
  - RULE-SET,KeviinAI,AI
  - RULE-SET,MetaAI,AI
  - RULE-SET,AI666,AI
  # Google + Gemini share AI egress to keep login/OAuth/IP behavior consistent.
  - RULE-SET,Google,AI

  # ---------- Streaming ----------
  # YouTube already matched above. Streaming must precede Social so TikTok/media
  # domains from GlobalMedia are deterministically classified as Streaming.
  - RULE-SET,Emby,Streaming
  - RULE-SET,KeviinGlobalMedia,Streaming
  - RULE-SET,Streaming,Streaming

  # ---------- Messaging / Social ----------
  - RULE-SET,Telegram,Telegram
  - RULE-SET,MetaSocial,Social
  - RULE-SET,SocialMedia,Social

  # ---------- Developer ----------
  - RULE-SET,DevMeta,Dev

  # ---------- Games / Crypto ----------
  - RULE-SET,KeviinGameDownloadCN,Direct
  - RULE-SET,KeviinGameCN,Direct
  - RULE-SET,KeviinGameProxy,Games
  - RULE-SET,Games,Games
  - RULE-SET,Crypto,Crypto

  # ---------- Apple / Microsoft ----------
  - RULE-SET,Apple,Apple
  # Copilot already matched AI above; remaining OneDrive/Microsoft traffic stays here.
  - RULE-SET,OneDrive,Microsoft
  - RULE-SET,Microsoft,Microsoft

  # ---------- Speedtest ----------
