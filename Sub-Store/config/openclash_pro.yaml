# ============================================================================
# OpenClash / OpenWrt Quality / Identity Routing V4.1.0-MF-Test
# Target: OpenClash + Mihomo v1.19.30+
#
# Ordinary nodes: Node Standardizer V2.1.5 -> IPQuality V1.4.1 -> Mihomo
# Chain nodes:    Node Standardizer V2.1.5 -> IPQuality V1.4.1 (auto bypass) -> Mihomo
#
# TEST PURPOSE:
#   Flatten every automatic fallback so its direct children are real provider nodes.
#   Multiple `filter` expressions are separated by backticks.
#   Mihomo preserves filter-bucket order, then fallback selects the first alive node.
#   This test intentionally keeps fallback `lazy: true` to isolate the topology change.
#
# IMPORTANT:
#   Ordered fallback groups below use `use: [proxy1]`, so this test expects provider mode.
#   This test expects the OpenClash provider path: Sub-Store OnlyNode -> GitHub -> proxy1.
# ============================================================================

# ==================== 00. User Configuration ====================
x-user-config:
  provider-url: &provider-url ""
  provider-path: &provider-path ./proxy_provider/proxy1.yaml
  provider-update-interval: &provider-update-interval 86400

  test-url: &test-url https://www.gstatic.com/generate_204
  test-interval: &test-interval 600
  test-timeout: &test-timeout 3000
  test-tolerance: &test-tolerance 80

  rule-update-interval: &rule-update-interval 86400


# ==================== 01. Reusable Templates ====================
x-fallback: &fallback
  type: fallback
  interval: *test-interval
  lazy: true
  url: *test-url
  timeout: *test-timeout
  expected-status: 204
  empty-fallback: REJECT

x-url-test: &url-test
  type: url-test
  include-all: true
  interval: *test-interval
  tolerance: *test-tolerance
  lazy: true
  url: *test-url
  timeout: *test-timeout
  expected-status: 204
  empty-fallback: REJECT

x-select-nodes: &select-nodes
  type: select
  include-all: true
  empty-fallback: REJECT

