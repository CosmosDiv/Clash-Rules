# Every automatic fallback in this test consumes real nodes from proxy1 directly.
x-provider-fallback: &provider-fallback
  <<: *fallback
  use: [proxy1]
  exclude-filter: *exclude-chain

# ==================== 03. Proxy Sources ====================
# Ordered fallback groups in this test consume `proxy1` directly.
# If provider mode is used, top-level static `proxies:` remains empty.
proxies: []

proxy-providers:
  proxy1:
    type: http
    url: *provider-url
    path: *provider-path
    interval: *provider-update-interval
    proxy: DIRECT
    header:
      User-Agent:
        - "ClashMetaForAndroid/2.11.2.Meta"
        - "clash-verge/v2.2.3"
        - "ClashforWindows/0.19.23"
        - "clash.meta"
        - "mihomo"
    # Policy url-test/fallback groups already perform health checks.
    health-check:
      enable: false

# ==================== 04. OpenClash Runtime ====================
geox-url:
  mmdb: "https://testingcf.jsdelivr.net/gh/alecthw/mmdb_china_ip_list@release/Country.mmdb"
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  asn: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/geoip@release/GeoLite2-ASN.mmdb"
geo-auto-update: true
geo-update-interval: 24
geodata-mode: true
# Router-oriented default. Change to `standard` only when OpenWrt RAM is comfortably abundant.
geodata-loader: memconservative

mode: rule
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true
log-level: warning
bind-address: '*'
# No PROCESS-* rules are used; OpenClash also recommends off on routers.
keep-alive-interval: 15
keep-alive-idle: 600

experimental:
  quic-go-disable-gso: false

# OpenClash normally rewrites controller/secret from UCI. These values are safe defaults.
external-controller: 0.0.0.0:9090
secret: yyds666

profile:
  # Current OpenClash runtime also forces store-selected=true when applying configuration.
  store-selected: true
  store-fake-ip: true

# ---------- Sniffer ----------
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ---------- TUN ----------
# OpenClash integrates routing/firewall itself; match its generated Mihomo TUN shape.
tun:
  enable: true
  stack: system
  device: utun
  dns-hijack:
    - "127.0.0.1:53"
  endpoint-independent-nat: true
  auto-route: false
  auto-detect-interface: false
  auto-redirect: false
  strict-route: false

# ---------- DNS ----------
dns:
  enable: true
  ipv6: true
  # 7874 is OpenClash's default core DNS port and is used by its DNS integration.
  listen: 0.0.0.0:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-range6: fdab:47c2:9e1f:9876::1/64
  cache-algorithm: arc
  default-nameserver:
    - 119.29.29.29
    - 180.184.1.1
    - 223.5.5.5
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - "+.lan"
    - "*.local"
    - "+.miwifi.com"
    - "+.market.xiaomi.com"
    - "+.push.apple.com"
    - "+.pub.3gppnetwork.org"

