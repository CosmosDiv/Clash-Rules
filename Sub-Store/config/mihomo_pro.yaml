# ==================== 03. Proxy Sources ====================
# Sub-Store may inject static nodes here. With provider mode, keep this list empty.
proxies: []

proxy-providers:
  proxy1:
    type: http
    url: *provider-url
    path: *provider-path
    interval: *provider-update-interval
    proxy: DIRECT
    header:
      User-Agent:
        - "ClashMetaForAndroid/2.11.2.Meta"
        - "clash-verge/v2.2.3"
        - "ClashforWindows/0.19.23"
        - "clash.meta"
        - "mihomo"
    # Real-node url-test groups perform the policy health checks.
    health-check:
      enable: false

# ==================== 04. Mihomo Core ====================
geox-url:
  mmdb: "https://testingcf.jsdelivr.net/gh/alecthw/mmdb_china_ip_list@release/Country.mmdb"
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  asn: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/geoip@release/GeoLite2-ASN.mmdb"
geo-auto-update: true
geo-update-interval: 24
geodata-mode: true
geodata-loader: standard

mode: rule
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: false
log-level: warning
bind-address: '*'
find-process-mode: 'off'
keep-alive-interval: 15
keep-alive-idle: 600

authentication:
  - mihomo:yyds666
skip-auth-prefixes:
  - 192.168.1.0/24
  - 192.168.31.0/24
  - 192.168.100.0/24
  - 127.0.0.1/8

experimental:
  quic-go-disable-gso: false

# ---------- Dashboard ----------
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
external-ui-name: zashboard
external-ui: ui
external-controller: 127.0.0.1:9090
secret: yyds666

profile:
  store-selected: true
  store-fake-ip: true

# ---------- Sniffer ----------
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.v2ex.com
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ---------- TUN ----------
tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# ---------- DNS ----------
dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-range6: fdab:47c2:9e1f:9876::1/64
  cache-algorithm: arc
  default-nameserver:
    - 119.29.29.29
    - 180.184.1.1
    - 223.5.5.5
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - "+.lan"
    - "*.local"
    - "+.miwifi.com"
    - "+.market.xiaomi.com"
    - "+.push.apple.com"
    - "+.pub.3gppnetwork.org"

# ==================== 05. Proxy Groups ====================
proxy-groups:
  # ---------- Core ----------
  - name: Proxy
    type: select
    proxies: [Fallback, HK, TW, SG, JP, KR, US, CA, AU, UK, EU, All Nodes, Direct]
    default-selected: Fallback
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
  - name: Fallback
    <<: *fallback
    proxies: [HK Auto, TW Auto, SG Auto, JP Auto, KR Auto, US Auto, CA Auto, AU Auto, UK Auto, EU Auto]
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available.png"
  - name: Direct
    type: select
    proxies: [DIRECT]
    default-selected: DIRECT
    hidden: true
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png"
  - name: All Nodes
    <<: *select-nodes
    filter: *filter-all-ordinary
    exclude-filter: *exclude-chain
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
  - name: Speedtest
    type: select
    proxies: [Direct, Proxy, HK, TW, SG, JP, KR, US, CA, AU, UK, EU]
    default-selected: Direct
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Speedtest.png"

  # ---------- Front / Chain ----------
  - name: Front Proxy
    type: select
    proxies: [Front Auto, Front Manual, Direct]
    default-selected: Front Auto
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
  - name: Front Auto
    <<: *fallback
    proxies: [US Auto, HK Auto, JP Auto, TW Auto, SG Auto]
    hidden: true
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png"
  - name: Front Manual
    <<: *select-nodes
    filter: *filter-all-ordinary
    exclude-filter: *exclude-chain
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
  # Chain landing nodes should already carry `dialer-proxy: Front Proxy` from Sub-Store.
  - name: Chain
    <<: *select-nodes
    filter: *filter-chain
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Server.png"

  # ---------- Services ----------
  # Ordinary services expose five core regions for a compact UI.
  # Full 10-region control remains available through Proxy / Fallback / Speedtest.
