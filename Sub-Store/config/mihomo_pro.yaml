    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"
  - name: Fallback
    <<: *fallback
    proxies: [HK Auto, TW Auto, SG Auto, JP Auto, KR Auto, US Auto, CA Auto, AU Auto, UK Auto, EU Auto]
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available.png"
  - name: Direct
    type: select
    proxies: [DIRECT]
    default-selected: DIRECT
    hidden: true
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png"
  - name: Final
    type: select
    proxies: [Proxy, Direct]
    default-selected: Proxy
  - name: All Nodes
