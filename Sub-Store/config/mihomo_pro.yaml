# ============================================================================
# Mihomo Bare-Core Quality / Identity Routing V4.0.1
# Target: Mihomo v1.19.30+
#
# Ordinary nodes: Node Standardizer V2.1.5 -> IPQuality V1.1.1 -> Mihomo
# Chain nodes:    Node Standardizer V2.1.5 -> IPQuality V1.1.1 (auto bypass) -> Mihomo
#
# Node source modes (normally use one at a time):
#   1. Static nodes written to top-level `proxies:` by Sub-Store
#   2. One Sub-Store URL in `proxy-providers.proxy1.url`
# Real-node groups use include-all + normalized-name filters, so both modes share
# the same policy logic.
# ============================================================================

# ==================== 00. User Configuration ====================
# Normal maintenance should start here.
x-user-config:
  provider-url: &provider-url ""
  provider-path: &provider-path ./proxies/proxy1.yaml
  provider-update-interval: &provider-update-interval 86400

  test-url: &test-url https://www.gstatic.com/generate_204
  test-interval: &test-interval 600
  test-timeout: &test-timeout 3000
  test-tolerance: &test-tolerance 80

  rule-update-interval: &rule-update-interval 86400


# ==================== 01. Reusable Templates ====================
x-fallback: &fallback
  type: fallback
  interval: *test-interval
  lazy: true
  url: *test-url
  timeout: *test-timeout
  expected-status: 204
  empty-fallback: REJECT

x-url-test: &url-test
  type: url-test
  include-all: true
  interval: *test-interval
  tolerance: *test-tolerance
  lazy: true
  url: *test-url
  timeout: *test-timeout
  expected-status: 204
  empty-fallback: REJECT

x-select-nodes: &select-nodes
  type: select
  include-all: true
  empty-fallback: REJECT

# ==================== 02. Node Filters ====================
# Filters consume Standardizer/IPQuality facts only; YAML does not re-infer IP identity.
x-filter-chain: &filter-chain '(?i)^US @Chain-[^ ｜]+(?: |｜|$)`(?i)^JP @Chain-[^ ｜]+(?: |｜|$)`(?i)^SG @Chain-[^ ｜]+(?: |｜|$)`(?i)^(?!(?:US|JP|SG) )(?:[A-Z]{2}|Multi|Unknown) @Chain-[^ ｜]+(?: |｜|$)'
x-exclude-chain: &exclude-chain '(?i)^(?:[A-Z]{2}|Multi|Unknown) @Chain-[^ ｜]+(?: |｜|$)'

x-filter-hk-trust: &filter-hk-trust '(?i)^HK (?=[^｜]*[ ·]Trust(?:[·｜]|$)).*$'
x-filter-hk-normal: &filter-hk-normal '(?i)^HK (?=[^｜]*[ ·]Normal(?:[·｜]|$)).*$'
x-filter-hk-manual: &filter-hk-manual '(?i)^HK (?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'

x-filter-tw-trust: &filter-tw-trust '(?i)^TW (?=[^｜]*[ ·]Trust(?:[·｜]|$)).*$'
