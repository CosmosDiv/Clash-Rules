# ============================================================================
# Mihomo Bare-Core Quality / Identity Routing V4.2.0
# Target: Mihomo v1.19.30+
#
# Ordinary nodes: Node Standardizer V2.1.5 -> IPQuality V1.4.3 -> Mihomo
# Chain nodes:    Node Standardizer V2.1.5 -> IPQuality V1.4.3 (auto bypass) -> Mihomo
#
# Policy architecture:
#   Ordinary region Auto groups combine Trust + Normal and use URL-Test for in-region selection.
#   Global / Front / ordinary service Auto groups use Fallback only for ordered region failover.
#   AI / RedPocket remain Trust-only strict identity pools using ISPIP / HostIP.
#   Final catch-all remains proxy-first while exposing a manual Direct override.
#   Fallback health checking uses Apple; url-test latency checking uses Cloudflare.
#
# Node source compatibility:
#   Both Sub-Store static-node injection and proxy-provider mode are supported.
#   `include-all: true` allows the same policy layer to consume either source mode.
#
# Bare-core runtime:
#   Standalone Mihomo ports, authentication, dashboard, DNS and optional TUN settings
#   remain independent from OpenClash/Surfing platform integration.
# ============================================================================

# ==================== 00. User Configuration ====================
x-user-config:
  provider-url: &provider-url ""
  provider-path: &provider-path ./proxies/proxy1.yaml
  provider-update-interval: &provider-update-interval 86400

  # Separate reachability checking from latency comparison.
  health-url: &health-url https://www.apple.com/library/test/success.html
  latency-url: &latency-url https://cp.cloudflare.com/generate_204
  test-interval: &test-interval 600
  test-timeout: &test-timeout 3000
  test-tolerance: &test-tolerance 80

  rule-update-interval: &rule-update-interval 86400


# ==================== 01. Reusable Templates ====================
x-fallback: &fallback
  type: fallback
  interval: *test-interval
  lazy: true
  url: *health-url
  timeout: *test-timeout
  expected-status: 200
  empty-fallback: REJECT

x-url-test: &url-test
  type: url-test
  include-all: true
  interval: *test-interval
  tolerance: *test-tolerance
  lazy: true
  url: *latency-url
  timeout: *test-timeout
  expected-status: 204
  empty-fallback: REJECT

x-select-nodes: &select-nodes
  type: select
  include-all: true
  empty-fallback: REJECT

# ==================== 02. Node Filters ====================
# IPQuality V1.4.3 contract:
#   Auto   -> Trust | Normal
#   Manual -> Trust | Normal | Unrated
#   Risk   -> removed by IPQuality in normal production mode
# Network identity (ISPIP / HostIP) is used only by strict AI / RedPocket pools.
x-filter-chain: &filter-chain '(?i)^US @Chain-[^ ｜]+(?: |｜|$)`(?i)^JP @Chain-[^ ｜]+(?: |｜|$)`(?i)^SG @Chain-[^ ｜]+(?: |｜|$)`(?i)^(?!(?:US|JP|SG) )(?:[A-Z]{2}|Multi|Unknown) @Chain-[^ ｜]+(?: |｜|$)'
x-exclude-chain: &exclude-chain '(?i)^(?:[A-Z]{2}|Multi|Unknown) @Chain-[^ ｜]+(?: |｜|$)'

x-filter-hk-auto: &filter-hk-auto '(?i)^HK (?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$)).*$'
x-filter-hk-manual: &filter-hk-manual '(?i)^HK (?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'

x-filter-tw-auto: &filter-tw-auto '(?i)^TW (?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$)).*$'
x-filter-tw-manual: &filter-tw-manual '(?i)^TW (?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'
x-filter-tw-isp: &filter-tw-isp '(?i)^TW (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]ISPIP(?:[·｜]|$)).*$'
x-filter-tw-host: &filter-tw-host '(?i)^TW (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]HostIP(?:[·｜]|$)).*$'

x-filter-sg-auto: &filter-sg-auto '(?i)^SG (?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$)).*$'
x-filter-sg-manual: &filter-sg-manual '(?i)^SG (?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'
x-filter-sg-isp: &filter-sg-isp '(?i)^SG (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]ISPIP(?:[·｜]|$)).*$'
x-filter-sg-host: &filter-sg-host '(?i)^SG (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]HostIP(?:[·｜]|$)).*$'

x-filter-jp-auto: &filter-jp-auto '(?i)^JP (?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$)).*$'
x-filter-jp-manual: &filter-jp-manual '(?i)^JP (?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'
x-filter-jp-isp: &filter-jp-isp '(?i)^JP (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]ISPIP(?:[·｜]|$)).*$'
x-filter-jp-host: &filter-jp-host '(?i)^JP (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]HostIP(?:[·｜]|$)).*$'

x-filter-kr-auto: &filter-kr-auto '(?i)^KR (?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$)).*$'
x-filter-kr-manual: &filter-kr-manual '(?i)^KR (?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'

x-filter-us-auto: &filter-us-auto '(?i)^US (?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$)).*$'
x-filter-us-manual: &filter-us-manual '(?i)^US (?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'
x-filter-us-isp: &filter-us-isp '(?i)^US (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]ISPIP(?:[·｜]|$)).*$'
x-filter-us-host: &filter-us-host '(?i)^US (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]HostIP(?:[·｜]|$)).*$'

x-filter-ca-auto: &filter-ca-auto '(?i)^CA (?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$)).*$'
x-filter-ca-manual: &filter-ca-manual '(?i)^CA (?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'

x-filter-au-auto: &filter-au-auto '(?i)^AU (?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$)).*$'
x-filter-au-manual: &filter-au-manual '(?i)^AU (?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'

x-filter-uk-auto: &filter-uk-auto '(?i)^UK (?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$)).*$'
x-filter-uk-manual: &filter-uk-manual '(?i)^UK (?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'

x-filter-eu-auto: &filter-eu-auto '(?i)^(?:AT|BE|BG|CY|CZ|DE|DK|EE|ES|FI|FR|GR|HR|HU|IE|IT|LT|LU|LV|MT|NL|PL|PT|RO|SE|SI|SK) (?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$)).*$'
x-filter-eu-manual: &filter-eu-manual '(?i)^(?:AT|BE|BG|CY|CZ|DE|DK|EE|ES|FI|FR|GR|HR|HU|IE|IT|LT|LU|LV|MT|NL|PL|PT|RO|SE|SI|SK) (?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'

x-filter-all-ordinary: &filter-all-ordinary '(?i)^(?:[A-Z]{2}|Multi|Unknown) @(?=[^｜]*[ ·](?:Trust|Normal|Unrated)(?:[·｜]|$)).*$'
x-filter-youtube-bulk: &filter-youtube-bulk '(?i)^(?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$))(?=[^｜]*[ ·]Bulk(?:[·｜]|$)).*$'
x-filter-youtube-auto: &filter-youtube-auto '(?i)^(?=[^｜]*[ ·](?:Trust|Normal)(?:[·｜]|$))(?=[^｜]*[ ·]Bulk(?:[·｜]|$))(?=[^｜]*[ ·](?:0(?:\.\d+)?|1(?:\.0+)?)x(?:[·｜]|$)).*$'

# ---------- Strict identity fallback policy ----------
# AI / RedPocket keep Trust-only identity ordering. Ordinary services do not use identity labels.
x-filter-order-ai: &filter-order-ai '(?i)^US (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]ISPIP(?:[·｜]|$)).*$`(?i)^US (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]HostIP(?:[·｜]|$)).*$`(?i)^JP (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]ISPIP(?:[·｜]|$)).*$`(?i)^JP (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]HostIP(?:[·｜]|$)).*$`(?i)^TW (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]ISPIP(?:[·｜]|$)).*$`(?i)^TW (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]HostIP(?:[·｜]|$)).*$`(?i)^SG (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]ISPIP(?:[·｜]|$)).*$`(?i)^SG (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]HostIP(?:[·｜]|$)).*$'
x-filter-order-us-ai: &filter-order-us-ai '(?i)^US (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]ISPIP(?:[·｜]|$)).*$`(?i)^US (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]HostIP(?:[·｜]|$)).*$'
x-filter-order-jp-ai: &filter-order-jp-ai '(?i)^JP (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]ISPIP(?:[·｜]|$)).*$`(?i)^JP (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]HostIP(?:[·｜]|$)).*$'
x-filter-order-tw-ai: &filter-order-tw-ai '(?i)^TW (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]ISPIP(?:[·｜]|$)).*$`(?i)^TW (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]HostIP(?:[·｜]|$)).*$'
x-filter-order-sg-ai: &filter-order-sg-ai '(?i)^SG (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]ISPIP(?:[·｜]|$)).*$`(?i)^SG (?=[^｜]*[ ·]Trust(?:[·｜]|$))(?=[^｜]*[ ·]HostIP(?:[·｜]|$)).*$'

# Only strict identity fallback groups consume real nodes directly.
x-node-fallback: &node-fallback
  <<: *fallback
  include-all: true
  exclude-filter: *exclude-chain

# ==================== 03. Proxy Sources ====================
# Sub-Store may inject static nodes here. With provider mode, keep this list empty.
proxies: []

proxy-providers:
  proxy1:
    type: http
    url: *provider-url
    path: *provider-path
    interval: *provider-update-interval
    proxy: DIRECT
    header:
      User-Agent:
        - "ClashMetaForAndroid/2.11.2.Meta"
        - "clash-verge/v2.2.3"
        - "ClashforWindows/0.19.23"
        - "clash.meta"
        - "mihomo"
    # Policy url-test/fallback groups already perform health checks.
    health-check:
      enable: false

# ==================== 04. Mihomo Core ====================
geox-url:
  mmdb: "https://testingcf.jsdelivr.net/gh/alecthw/mmdb_china_ip_list@release/Country.mmdb"
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  asn: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/geoip@release/GeoLite2-ASN.mmdb"
geo-auto-update: true
geo-update-interval: 24
geodata-mode: true
geodata-loader: standard

mode: rule
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true
log-level: warning
bind-address: '*'
find-process-mode: 'off'
keep-alive-interval: 15
keep-alive-idle: 600

authentication:
  - mihomo:yyds666
skip-auth-prefixes:
  - 192.168.1.0/24
  - 192.168.31.0/24
  - 192.168.100.0/24
  - 127.0.0.1/8

experimental:
  quic-go-disable-gso: false

# ---------- Dashboard ----------
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
external-ui-name: zashboard
external-ui: ui
external-controller: 127.0.0.1:9090
secret: yyds666

profile:
  store-selected: true
  store-fake-ip: true

# ---------- Sniffer ----------
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.v2ex.com
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ---------- TUN ----------
tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# ---------- DNS ----------
dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-range6: fdab:47c2:9e1f:9876::1/64
  cache-algorithm: arc
  default-nameserver:
    - 119.29.29.29
    - 180.184.1.1
    - 223.5.5.5
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - "+.lan"
    - "*.local"
    - "+.miwifi.com"
    - "+.market.xiaomi.com"
    - "+.push.apple.com"
    - "+.pub.3gppnetwork.org"

# ==================== 05. Proxy Groups ====================
proxy-groups:
