# ============================================================================
# Mihomo Bare-Core Enhanced Chain V2.3.7
# Policy/routing structure aligned with Surfing V2.3.7; platform-specific core settings retained.
# Based on 666OS/YYDS v2 design ideas and current Mihomo capabilities.
# ============================================================================

# ==================== Reusable Anchors ====================

# Health checks: stability is preferred over chasing tiny latency gaps.
x-fallback: &fallback
  type: fallback
  interval: 600
  lazy: true
  url: https://www.gstatic.com/generate_204
  timeout: 3000
  expected-status: 204
  empty-fallback: REJECT

x-url-test-near: &url-test-near
  type: url-test
  interval: 600
  tolerance: 50
  lazy: true
  url: https://www.gstatic.com/generate_204
  timeout: 3000
  expected-status: 204
  hidden: true
  empty-fallback: REJECT

x-url-test-mid: &url-test-mid
  type: url-test
  interval: 600
  tolerance: 70
  lazy: true
  url: https://www.gstatic.com/generate_204
  timeout: 3000
  expected-status: 204
  hidden: true
  empty-fallback: REJECT

x-url-test-far: &url-test-far
  type: url-test
  interval: 600
  tolerance: 100
  lazy: true
  url: https://www.gstatic.com/generate_204
  timeout: 3000
  expected-status: 204
  hidden: true
  empty-fallback: REJECT

# ISP nodes use a real service-health endpoint because generic probe domains
# may be intentionally blocked by the private residential provider.
x-us-isp-fallback: &us-isp-fallback
  type: fallback
  interval: 1800
  lazy: true
  url: https://aistudio.google.com/app/prompts/new_chat
  timeout: 10000
  expected-status: '200-399'
  hidden: true
  empty-fallback: REJECT

