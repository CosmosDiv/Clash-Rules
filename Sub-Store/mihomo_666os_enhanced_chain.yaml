    behavior: classical
    payload:
      # RedPocket GSMA / AT&T legacy MMS proxy
      - IP-CIDR,66.209.11.33/32,no-resolve
      # T-Mobile / GSMT Wi-Fi Calling ranges: broad fallback, keep scoped to RedPocket eSIM group.
      - IP-CIDR,208.54.0.0/16,no-resolve
      - IP-CIDR,66.94.0.0/19,no-resolve
      # T-Mobile authentication / CRL
      - IP-CIDR,206.29.177.36/32,no-resolve

