# 根据666os yyds配置修改，不管dns泄露，但是尽可能的先把海外域名涵盖，尽可能直接域名识别分流。
# 然后为了访问国内可能存在的小众站点正常，国内ip选择了一个尽可能大的，然后没用加no-resolve
# 如果要防止泄露，本规则直接最后的所有ip规则后面加no-resolve
# ==================== 锚点配置 ====================
# 代理提供者模板 - 订阅源基础配置
BaseProvider: &BaseProvider {type: http, interval: 86400, proxy: DIRECT, health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', interval: 300}, filter: '^(?!.*(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))'}

# 策略组类型模板 - 定义不同的策略组基础配置
BaseFB: &BaseFB {type: fallback, interval: 300, lazy: true, url: 'https://www.gstatic.com/generate_204', timeout: 3000, expected-status: 204, empty-fallback: REJECT}
BaseUTNear: &BaseUTNear {type: url-test, interval: 300, tolerance: 20, lazy: true, url: 'https://www.gstatic.com/generate_204', timeout: 3000, expected-status: 204, hidden: true, empty-fallback: REJECT}
BaseUTMid:  &BaseUTMid  {type: url-test, interval: 300, tolerance: 35, lazy: true, url: 'https://www.gstatic.com/generate_204', timeout: 3000, expected-status: 204, hidden: true, empty-fallback: REJECT}
BaseUTFar:  &BaseUTFar  {type: url-test, interval: 300, tolerance: 50, lazy: true, url: 'https://www.gstatic.com/generate_204', timeout: 3000, expected-status: 204, hidden: true, empty-fallback: REJECT}
USHomeFB: &USHomeFB {type: fallback, interval: 900, lazy: true, url: 'https://aistudio.google.com/app/prompts/new_chat', timeout: 10000, expected-status: '200-399', hidden: true, empty-fallback: REJECT}

