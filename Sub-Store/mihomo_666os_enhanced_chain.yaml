# ==================== Rules ====================
rules:
  # ---------- Local overrides ----------
  - DOMAIN-SUFFIX,glkvm.cn,DIRECT

  # ---------- Blocking ----------
  - RULE-SET,Tracking,REJECT
  - RULE-SET,Advertising,REJECT

  # QUIC policy: allowed by default.
  # If overseas browsing feels sticky while bandwidth is normal, temporarily enable
  # the next line for A/B testing. Keep it disabled when QUIC works well.
  # - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT

  # ---------- Local / Direct ----------
  - RULE-SET,Private,Direct
  - RULE-SET,Direct,Direct
  - RULE-SET,XPTV,Direct
  - RULE-SET,Download,Direct
  - RULE-SET,SystemOTA,Direct
  - RULE-SET,AppleCN,Direct

  # ---------- RedPocket ----------
  - RULE-SET,RedPocket,RedPocket

  # ---------- Google + Gemini: same egress ----------
  # Put these before broad AI / CN rules so login, OAuth and Gemini assets remain consistent.
  - RULE-SET,GoogleGemini,Google
  - RULE-SET,Gemini,Google

  # ---------- Streaming / YouTube ----------
  # Specific media rules must precede broad Google.mrs because Google also contains YouTube domains.
  - RULE-SET,YouTube,YouTube
  - RULE-SET,Emby,Streaming
  - RULE-SET,Streaming,Streaming

  # ---------- Broad Google ----------
  - RULE-SET,Google,Google

  # ---------- AI ----------
  # Individual public rule sets first, then broad AI collections.
  # Google/Gemini rules stay above this block to keep their egress consistent.
  - RULE-SET,MetaOpenAI,AI
  - RULE-SET,OpenAI,AI
  - RULE-SET,MetaAnthropic,AI
  - RULE-SET,Claude,AI
  - RULE-SET,AI,AI
  - RULE-SET,AIMeta,AI

  # ---------- Services ----------
  - DOMAIN-KEYWORD,speedtest,Speedtest
  - RULE-SET,Speedtest,Speedtest
  - RULE-SET,Dev,Dev
  - RULE-SET,TM,Telegram
  - RULE-SET,Telegram,Telegram
  - RULE-SET,SocialMedia,Social
  - RULE-SET,Games,Games
  - RULE-SET,Crypto,Crypto
  - RULE-SET,Apple,Apple
  - RULE-SET,OneDrive,Microsoft
  - RULE-SET,Microsoft,Microsoft

  # ---------- Domestic domain recovery ----------
  # Two independent domain sources are intentionally retained for strong CN coverage.
  - RULE-SET,China,Direct
  - GEOSITE,cn,Direct

  # ---------- Explicit overseas domains ----------
  - RULE-SET,Proxy,Overseas
  - GEOSITE,geolocation-!cn,Overseas

  # ---------- IP rules ----------
  - RULE-SET,AdvertisingIP,REJECT,no-resolve
  - RULE-SET,PrivateIP,Direct,no-resolve
  - RULE-SET,AppleCNIP,Direct,no-resolve
  - RULE-SET,XPTVIP,Direct,no-resolve
  - RULE-SET,RedPocketIP,RedPocket,no-resolve
  - RULE-SET,AIIP,AI,no-resolve
  - RULE-SET,TelegramIP,Telegram,no-resolve
  - RULE-SET,SocialMediaIP,Social,no-resolve
  - RULE-SET,EmbyIP,Streaming,no-resolve
  - RULE-SET,StreamingIP,Streaming,no-resolve
  - RULE-SET,GoogleIP,Google,no-resolve

  # ---------- China IP privacy switch ----------
  # DEFAULT / PRIVACY-FIRST:
  # Unknown DOMAIN traffic will NOT trigger an extra DNS lookup only to test ChinaIP.
  # This reduces DNS exposure. Actual IP traffic can still match ChinaIP/GEOIP.
  - RULE-SET,ChinaIP,Direct,no-resolve
  - GEOIP,CN,Direct,no-resolve

  # OPTIONAL / STRONGER CN RECOVERY:
  # If a rare domestic site is incorrectly sent to Final/Overseas, comment out the two
  # privacy-first lines above and enable the next two lines. ChinaIP will then actively
  # resolve unmatched domains once to recover more domestic services.
  # - RULE-SET,ChinaIP,Direct
  # - GEOIP,CN,Direct,no-resolve

  # ---------- Overseas IP fallback ----------
  - RULE-SET,ProxyIP,Overseas,no-resolve

  # ---------- Final ----------
  - MATCH,Final

