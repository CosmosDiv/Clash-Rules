# ==================== Proxy Provider ====================
proxy-providers:
  proxy1:
    type: http
    interval: 86400
    proxy: DIRECT
    header:
      User-Agent:
        - "ClashMetaForAndroid/2.11.2.Meta"
        - "clash-verge/v2.2.3"
        - "ClashforWindows/0.19.23"
        - "clash.meta"
        - "mihomo"

    # Deliberately disabled: proxy groups below perform their own health checks.
    health-check:
      enable: false
    url: ""
    path: ./proxies/proxy1.yaml

# ==================== GeoData ====================
geox-url:
  mmdb: "https://testingcf.jsdelivr.net/gh/alecthw/mmdb_china_ip_list@release/Country.mmdb"
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  asn: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/geoip@release/GeoLite2-ASN.mmdb"

geo-auto-update: true
geo-update-interval: 24
geodata-mode: true

# ==================== Mihomo Core ====================
# Preserve the existing bare-core port layout and LAN authentication behavior.
mode: rule
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
ipv6: true
allow-lan: true
unified-delay: true
# Keep enabled here; Surfing's tcp-concurrent issue is not generalized to other platforms.
tcp-concurrent: true
log-level: warning
bind-address: '*'
find-process-mode: 'always'
keep-alive-interval: 15
keep-alive-idle: 600

authentication:
  - mihomo:yyds666
skip-auth-prefixes:
  - 192.168.1.0/24
  - 192.168.31.0/24
  - 192.168.100.0/24
  - 127.0.0.1/8

experimental:
  quic-go-disable-gso: false

# ==================== Dashboard ====================
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
external-ui-name: zashboard
external-ui: ui
external-controller: 127.0.0.1:9090
secret: yyds666

profile:
  store-selected: false
  store-fake-ip: true

# ==================== Sniffer ====================
# Preserve the existing bare-core sniffer behavior; policy naming is unified separately.
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.v2ex.com
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ==================== TUN ====================
# Disabled by default for the generic bare-core profile; settings are ready if enabled later.
tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# ==================== DNS ====================
dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-range6: fdab:47c2:9e1f:9876::1/64
  cache-algorithm: arc

  # Bootstrap resolvers for DoH hostnames.
  default-nameserver:
    - 119.29.29.29
    - 180.184.1.1
    - 223.5.5.5

  # Keep upstream DNS deliberately simple and consistent with V2.3.7.
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # Only compatibility-sensitive domains bypass Fake-IP.
  fake-ip-filter:
    - "+.lan"
    - "*.local"
    - "+.miwifi.com"
    - "+.market.xiaomi.com"
    - "+.push.apple.com"
    - "+.pub.3gppnetwork.org"

# ==================== Proxy Groups ====================
proxy-groups:
  # ---------- Core ----------
  - {name: Proxy, <<: *select-proxy, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png"}
  - {name: Fallback, <<: *fallback, proxies: [HK Auto, TW Auto, SG Auto, JP Auto, KR Auto, US Auto, UK Auto, EU Auto], icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available.png"}
  - {name: Overseas, <<: *select-global, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png"}
  - {name: Direct, type: select, proxies: [DIRECT], hidden: true, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png"}
  - {name: Final, <<: *select-global, icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Final.png"}

